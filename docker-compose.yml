services:
  postgres:
    image: postgres:17
    container_name: autoerp-postgres
    environment:
      POSTGRES_USER: autoerp
      POSTGRES_PASSWORD: autoerp
      POSTGRES_DB: autoerp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: